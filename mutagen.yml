##########################################################
# Mutagen config for syncing data to and from the cluster
# See: https://mutagen.io/documentation/introduction/
#
# To sync, run:
# $ mutagen project start
##########################################################

sync:
  defaults:
    mode: "one-way-replica"
    ignore:
      vcs: true
      paths:
        - ".DS_Store"
        - ".git"
        - "node_modules"
        - "*.tar"
        - "*.gz"
        - "**/figures/"
        - "**/tables/"

  allegro:
    alpha: "."
    beta: "allegro.imp.fu-berlin.de:workspace/sync/data_science_for_life_science_summer_2026_project"


  fetch-results-from-allegro:
    alpha: "allegro.imp.fu-berlin.de:/data/scratch/inbad03/.data_science_project/persistence/results"
    beta: "./synced/results"

  fetch-ground-truth-from-allegro:
    alpha: "allegro.imp.fu-berlin.de:/data/scratch/inbad03/.data_science_project/persistence/ground_truth"
    beta: "./synced/ground_truth"

  fetch-parameter-tuning-from-allegro:
    alpha: "allegro.imp.fu-berlin.de:/data/scratch/inbad03/.data_science_project/persistence/parameter_tuning"
    beta: "./synced/parameter_tuning"

  fetch-logs-from-allegro:
    alpha: "allegro.imp.fu-berlin.de:/data/scratch/inbad03/.data_science_project/logs"
    beta: "./remote_logs"

